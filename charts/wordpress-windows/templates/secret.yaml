{{- /* Generated credentials are read back from the live Secret so upgrades keep them. */ -}}
{{- $name := include "wpwin.fullname" . -}}
{{- $old := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $old = .data | default dict -}}
{{- end -}}
{{- $dbPassword := .Values.mysql.password | default ((get $old "mysql-password") | b64dec) | default (randAlphaNum 24) -}}
{{- $rootPassword := .Values.mysql.rootPassword | default ((get $old "mysql-root-password") | b64dec) | default (randAlphaNum 24) -}}
{{- $adminPassword := .Values.install.adminPassword | default ((get $old "wordpress-admin-password") | b64dec) | default (randAlphaNum 20) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wpwin.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-password: {{ $dbPassword | b64enc | quote }}
  mysql-root-password: {{ $rootPassword | b64enc | quote }}
  wordpress-admin-password: {{ $adminPassword | b64enc | quote }}
  {{- range $key := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
  {{- $secretKey := printf "WORDPRESS_%s" $key }}
  {{ $secretKey }}: {{ (get $old $secretKey) | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
  # Runs on every mysqld start (--init-file), so it must stay idempotent.
  init.sql: {{ printf `CREATE DATABASE IF NOT EXISTS %s CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';
ALTER USER '%s'@'%%' IDENTIFIED BY '%s';
GRANT ALL PRIVILEGES ON %s.* TO '%s'@'%%';
ALTER USER 'root'@'localhost' IDENTIFIED BY '%s';
FLUSH PRIVILEGES;
`
    (printf "`%s`" .Values.mysql.database)
    (include "wpwin.sqlString" .Values.mysql.username) (include "wpwin.sqlString" $dbPassword)
    (include "wpwin.sqlString" .Values.mysql.username) (include "wpwin.sqlString" $dbPassword)
    (printf "`%s`" .Values.mysql.database) (include "wpwin.sqlString" .Values.mysql.username)
    (include "wpwin.sqlString" $rootPassword) | b64enc | quote }}
