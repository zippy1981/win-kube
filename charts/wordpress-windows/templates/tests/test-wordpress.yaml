{{- $fullname := include "wpwin.fullname" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test
  labels:
    {{- include "wpwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "wpwin.windowsPodSpec" . | nindent 2 }}
  restartPolicy: Never
  containers:
    - name: test
      image: {{ include "wpwin.phpImage" . }}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      command: ["cmd", "/S", "/C", "C:\\config\\test-wordpress.cmd"]
      env:
        - name: WP_INTERNAL_URL
          value: {{ include "wpwin.wordpressUrl" . | quote }}
      volumeMounts:
        - name: files
          mountPath: 'C:\config'
          readOnly: true
  volumes:
    - name: files
      configMap:
        name: {{ $fullname }}-wordpress-files
