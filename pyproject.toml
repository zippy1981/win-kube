# Python tooling for this repo, managed with uv (ADR 0002). This isn't a Python package.
# The interpreter version comes from the UV_PYTHON environment variable, for example:
#   UV_PYTHON=3.14 UV_PYTHON_PREFERENCE=only-managed uv run pytest
[project]
name = "win-kube-repo-tools"
version = "0.1.0"
description = "Helper scripts (CI triage, repo status, union merge) and their tests"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "-q -rfE --no-header --tb=short"

[tool.ruff]
line-length = 120

# `uv run pytest --cov` (CI and pre-commit) fails below fail_under; a plain `uv run pytest -k ...` doesn't measure
# coverage, so running a few tests still works.
[tool.coverage.run]
relative_files = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
